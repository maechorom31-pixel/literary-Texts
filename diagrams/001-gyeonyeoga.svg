<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 980" role="img" aria-labelledby="t1 d1">
  <title id="t1">계녀가 — 부녀자의 도리 권계</title>
  <desc id="d1">서사(시집가는 딸 걱정)에서 출발해 ① 시부모 봉양과 길쌈, ② 자녀 양육과 교육, ③ 노비 관리, ④ 치산, ⑤ 행동과 처신의 다섯 단계가 위에서 아래로 나열되고, 결사에서 명령형으로 부녀자의 도리와 수신을 권계하는 결론으로 모인다.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="g-fill"/>
    </marker>
  </defs>
  <style><![CDATA[
    text { font-family: 'Noto Serif KR', serif; fill: #1a1612; }
    .sans { font-family: 'Pretendard','Apple SD Gothic Neo',sans-serif; }
    .head { font-size: 27px; font-weight: 700; }
    .ti { font-size: 18px; font-weight: 700; }
    .st { font-size: 14px; font-weight: 600; }
    .bd { font-size: 13.5px; font-weight: 400; fill: #4a3f33; }
    .xs { font-size: 11.5px; font-weight: 400; fill: #6b6256; }
    .paper { fill: #f5f1e8; } .paper2 { fill: #ebe5d4; }
    .rule { fill: none; stroke: #c9bfa8; stroke-width: 1.5; }
    .g-fill { fill: #2a6f6f; } .g-st { fill: none; stroke: #2a6f6f; stroke-width: 2.5; }
    .g-hd { fill: #2a6f6f; } .g-bg { fill: #2a6f6f; opacity: 0.10; }
    .white { fill: #f5f1e8; }
    .num { font-size: 16px; font-weight: 700; fill: #f5f1e8; }
    .reveal { opacity: 1; }
  ]]></style>

  <text x="500" y="48" text-anchor="middle" class="head">계녀가 — 부녀자의 도리 권계</text>
  <text x="500" y="76" text-anchor="middle" class="sans xs">규방 가사 · 어머니가 시집가는 딸에게 ‘~말아서라’로 일러 줌</text>
  <line x1="60" y1="94" x2="940" y2="94" class="g-st"/>

  <!-- 세로 흐름선 -->
  <line x1="150" y1="150" x2="150" y2="860" class="g-st" marker-end="url(#ar)"/>

  <g class="reveal" data-reveal-step="1" id="intro">
    <circle cx="150" cy="160" r="16" class="g-hd"/>
    <rect x="200" y="132" width="740" height="56" class="g-bg"/>
    <text x="222" y="166" class="ti">서사 · 떠나보내는 걱정</text>
    <text x="600" y="166" class="sans bd">‘내일이 신행’ — ‘이 심사 갈발없어’, ‘경계할 말 많고 많다’</text>
  </g>

  <g class="reveal" data-reveal-step="2" id="s1">
    <circle cx="150" cy="270" r="18" class="g-hd"/><text x="150" y="276" text-anchor="middle" class="num">1</text>
    <rect x="200" y="240" width="740" height="62" class="paper"/><rect x="200" y="240" width="740" height="62" class="rule"/>
    <text x="222" y="268" class="st">시부모 봉양과 길쌈</text>
    <text x="222" y="290" class="sans xs">문안·식성 맞춤 봉양, 규방으로 돌아와 부지런한 가사</text>
  </g>

  <g class="reveal" data-reveal-step="2" id="s2">
    <circle cx="150" cy="370" r="18" class="g-hd"/><text x="150" y="376" text-anchor="middle" class="num">2</text>
    <rect x="200" y="340" width="740" height="62" class="paper"/><rect x="200" y="340" width="740" height="62" class="rule"/>
    <text x="222" y="368" class="st">자녀 양육과 교육</text>
    <text x="222" y="390" class="sans xs">‘귀타고…/밉다고…’ 말라 — 감정에 치우치지 않는 절제</text>

    <circle cx="150" cy="470" r="18" class="g-hd"/><text x="150" y="476" text-anchor="middle" class="num">3</text>
    <rect x="200" y="440" width="740" height="62" class="paper"/><rect x="200" y="440" width="740" height="62" class="rule"/>
    <text x="222" y="468" class="st">노비 관리</text>
    <text x="222" y="490" class="sans xs">‘귀천은 다르나마 혈육은 한가지’ — 인(仁), 단 신분은 전제</text>
  </g>

  <g class="reveal" data-reveal-step="3" id="s3">
    <circle cx="150" cy="570" r="18" class="g-hd"/><text x="150" y="576" text-anchor="middle" class="num">4</text>
    <rect x="200" y="540" width="740" height="62" class="paper"/><rect x="200" y="540" width="740" height="62" class="rule"/>
    <text x="222" y="568" class="st">치산 (재산 관리)</text>
    <text x="222" y="590" class="sans xs">‘헌 의복 기워 입고 잡음식 먹’ — 검약</text>

    <circle cx="150" cy="670" r="18" class="g-hd"/><text x="150" y="676" text-anchor="middle" class="num">5</text>
    <rect x="200" y="640" width="740" height="62" class="paper"/><rect x="200" y="640" width="740" height="62" class="rule"/>
    <text x="222" y="668" class="st">행동과 처신</text>
    <text x="222" y="690" class="sans xs">남의 집 조심 · ‘인물 평론’·‘부귀 흠선’ 말라 — 신중</text>
  </g>

  <g class="reveal" data-reveal-step="3" id="end">
    <circle cx="150" cy="790" r="16" class="g-hd"/>
    <rect x="200" y="762" width="740" height="56" class="g-bg"/>
    <text x="222" y="796" class="ti">결사 · 권계</text>
    <text x="600" y="796" class="sans bd">시집살이 규범을 넘어 마음·말·몸가짐 등 ‘수신(修身)’ 전반을 당부</text>
  </g>

  <rect x="150" y="876" width="790" height="56" class="paper2"/><rect x="150" y="876" width="790" height="56" class="rule"/>
  <rect x="150" y="876" width="6" height="56" class="g-fill"/>
  <text x="174" y="900" class="st">한 줄 핵심</text>
  <text x="174" y="922" class="sans bd">며느리·어머니·안주인으로서의 도리를 <tspan font-weight="700" fill="#2a6f6f">열거·구체적 사례</tspan>로 권계 (걱정 + 당부의 어조)</text>

  <text x="940" y="962" text-anchor="end" class="sans xs" fill="#9a9080">EBS 2027 수능특강 · 갈래 복합(고전 시가) · 250쪽</text>
</svg>
