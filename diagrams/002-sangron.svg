<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" role="img" aria-labelledby="t2 d2">
  <title id="t2">상론 — 익힘이 상을 만든다</title>
  <desc id="d2">위쪽 통념 ‘상에서 익힘·운명으로’를 가위표로 부정하고, 그 아래 글쓴이의 주장 ‘익힘에서 상으로, 다시 형세로’를 굵은 화살표로 세운다. 주장 아래 두 근거가 받친다. 하나는 서당·시장·목동·강패 무리의 상이 다르다는 대조, 다른 하나는 평가에 따라 재상·백만장자·곤궁에 이르는 세 사례다. 맨 아래 결론은 상이 계속 변하므로 용모로 사람을 취하지 말라는 경계다.</desc>
  <defs>
    <marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="n-fill"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="r-fill"/>
    </marker>
  </defs>
  <style><![CDATA[
    text { font-family: 'Noto Serif KR', serif; fill: #1a1612; }
    .sans { font-family: 'Pretendard','Apple SD Gothic Neo',sans-serif; }
    .head { font-size: 27px; font-weight: 700; }
    .ti { font-size: 19px; font-weight: 700; }
    .st { font-size: 14.5px; font-weight: 600; }
    .bd { font-size: 13.5px; font-weight: 400; fill: #4a3f33; }
    .xs { font-size: 11.5px; font-weight: 400; fill: #6b6256; }
    .paper { fill: #f5f1e8; } .paper2 { fill: #ebe5d4; }
    .rule { fill: none; stroke: #c9bfa8; stroke-width: 1.5; }
    .n-fill { fill: #8b6f47; } .n-st { fill: none; stroke: #8b6f47; stroke-width: 2.5; }
    .n-hd { fill: #8b6f47; } .n-bg { fill: #8b6f47; opacity: 0.12; }
    .r-fill { fill: #a83a4a; } .r-st { fill: none; stroke: #a83a4a; stroke-width: 2.5; }
    .white { fill: #f5f1e8; }
    .reveal { opacity: 1; }
  ]]></style>

  <text x="500" y="48" text-anchor="middle" class="head">상론 — 익힘이 상(相)을 만든다</text>
  <text x="500" y="76" text-anchor="middle" class="sans xs">정약용 · 논변류 한문 산문 · 통념의 인과를 뒤집어 비판</text>
  <line x1="60" y1="94" x2="940" y2="94" class="n-st"/>

  <!-- 통념 (부정) -->
  <g class="reveal" data-reveal-step="1" id="thesis">
    <rect x="120" y="120" width="760" height="78" class="paper"/><rect x="120" y="120" width="760" height="78" class="rule"/>
    <text x="144" y="148" class="r-fill st">통념 (글쓴이가 ‘거짓’이라 함)</text>
    <text x="150" y="180" class="ti">상(相)</text>
    <line x1="232" y1="173" x2="430" y2="173" class="r-st" marker-end="url(#arR)"/>
    <text x="450" y="180" class="ti">익힘 · 운명</text>
    <line x1="150" y1="190" x2="700" y2="150" class="r-st"/>
    <text x="800" y="175" text-anchor="middle" class="r-fill head">×</text>

    <text x="500" y="228" text-anchor="middle" class="r-fill ti">↓ 인과를 뒤집는다</text>

    <!-- 주장 -->
    <rect x="120" y="244" width="760" height="84" class="n-bg"/><rect x="120" y="244" width="760" height="84" class="n-st"/>
    <text x="144" y="272" class="n-fill st">글쓴이의 주장</text>
    <text x="150" y="306" class="ti">익힘</text>
    <line x1="232" y1="299" x2="372" y2="299" class="n-st" stroke-width="4" marker-end="url(#arN)"/>
    <text x="392" y="306" class="ti">상(相)</text>
    <line x1="486" y1="299" x2="606" y2="299" class="n-st" stroke-width="4" marker-end="url(#arN)"/>
    <text x="626" y="306" class="ti">형세</text>
  </g>

  <!-- 근거 2개 -->
  <line x1="300" y1="328" x2="300" y2="372" class="n-st"/>
  <line x1="700" y1="328" x2="700" y2="372" class="n-st"/>
  <text x="500" y="362" text-anchor="middle" class="sans xs">두 갈래 근거로 뒷받침</text>

  <g class="reveal" data-reveal-step="2" id="evidence">
    <rect x="120" y="378" width="370" height="240" class="paper"/><rect x="120" y="378" width="370" height="240" class="rule"/>
    <rect x="120" y="378" width="6" height="240" class="n-fill"/>
    <text x="144" y="408" class="st">근거① 무리의 대조</text>
    <text x="144" y="436" class="sans bd">익히는 바가 달라 상이 달라진다</text>
    <text x="150" y="470" class="sans bd">· 서당의 무리 — 상이 아름다움</text>
    <text x="150" y="500" class="sans bd">· 시장의 무리 — 상이 검음</text>
    <text x="150" y="530" class="sans bd">· 목동의 무리 — 상이 산란함</text>
    <text x="150" y="560" class="sans bd">· 강패·마조 — 사납고 약빠름</text>
    <text x="150" y="596" class="sans xs">사람들은 변한 상을 보고 인과를 거꾸로 읽음</text>
  </g>

  <g class="reveal" data-reveal-step="3" id="cases">
    <rect x="510" y="378" width="370" height="240" class="paper2"/><rect x="510" y="378" width="370" height="240" class="rule"/>
    <rect x="510" y="378" width="6" height="240" class="n-fill"/>
    <text x="534" y="408" class="st">근거② 주위의 평가 → 형세</text>
    <text x="540" y="448" class="sans bd">㉠ ‘가르칠 만하다’ → 지원 ↑</text>
    <text x="560" y="470" class="sans st">→ 재상</text>
    <text x="540" y="508" class="sans bd">㉡ ‘부자 될 만하다’ → 자본 ↑</text>
    <text x="560" y="530" class="sans st">→ 백만장자</text>
    <text x="540" y="568" class="sans bd">㉢ 평가절하 → 협조 ↓</text>
    <text x="560" y="590" class="sans st" fill="#a83a4a">→ 곤궁</text>
  </g>

  <!-- 결론 -->
  <g class="reveal" data-reveal-step="4" id="conclusion">
    <line x1="500" y1="618" x2="500" y2="654" class="n-st" marker-end="url(#arN)"/>
    <rect x="120" y="660" width="760" height="120" class="n-hd"/>
    <text x="500" y="694" text-anchor="middle" class="white ti">결론 · 경계</text>
    <text x="500" y="726" text-anchor="middle" class="sans white" font-size="14">상은 거처·봉양·부귀·우환에 따라 끊임없이 변한다 — ‘상을 어떻게 정할 것인가’</text>
    <text x="500" y="752" text-anchor="middle" class="sans white" font-size="14">상을 믿으면 직업·친구·신하를 잃는다</text>
    <text x="500" y="772" text-anchor="middle" class="sans white" font-size="12.5">공자: 못생겼으나 어진 ‘자우’ — “용모로써 사람을 취하지 말라”</text>
  </g>

  <text x="940" y="942" text-anchor="end" class="sans xs" fill="#9a9080">EBS 2027 수능특강 · 갈래 복합(고전 산문) · 250쪽</text>
</svg>
