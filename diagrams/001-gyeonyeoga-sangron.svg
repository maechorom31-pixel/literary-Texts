<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" role="img" aria-labelledby="t1 d1">
  <title id="t1">계녀가 · 상론 — 통념을 경계하라</title>
  <desc id="d1">왼쪽은 가사 계녀가로 며느리의 도리, 자녀 양육, 노비 대우, 치산과 몸가짐의 당부가 위에서 아래로 나열된다. 오른쪽은 한문 산문 상론으로, 통념인 상에서 익힘으로 가는 인과를 가위표로 부정하고 글쓴이의 주장인 익힘에서 상으로 가는 인과를 굵은 화살표로 강조하며, 주위의 평가가 형세를 만드는 세 사례를 덧붙인다. 가운데 세로축 통념을 경계하라가 두 글을 묶고, 아래에 가는 대조적 상황 제시, 나는 사례를 통한 논증이라는 공통 방법이 표시된다.</desc>

  <defs>
    <marker id="arBold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="na-fill"/>
    </marker>
    <marker id="arAcc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="acc-fill"/>
    </marker>
    <marker id="arInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1612"/>
    </marker>
  </defs>

  <style><![CDATA[
    text { font-family: 'Noto Serif KR', serif; fill: #1a1612; }
    .sans { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; }
    .lbl-head   { font-size: 26px; font-weight: 700; }
    .lbl-title  { font-size: 19px; font-weight: 700; }
    .lbl-strong { font-size: 16px; font-weight: 600; }
    .lbl        { font-size: 14px; font-weight: 400; fill: #4a3f33; }
    .lbl-sm     { font-size: 12.5px; font-weight: 400; fill: #4a3f33; }
    .lbl-xs     { font-size: 11px; font-weight: 400; fill: #6b6256; }
    .paper  { fill: #f5f1e8; }
    .paper2 { fill: #ebe5d4; }
    .rule   { fill: none; stroke: #c9bfa8; stroke-width: 1.5; }
    .ink    { fill: none; stroke: #1a1612; stroke-width: 2; }
    .ga-fill { fill: #2a6f6f; } .ga-st { fill: none; stroke: #2a6f6f; stroke-width: 2; }
    .ga-bg   { fill: #2a6f6f; opacity: 0.10; }
    .ga-hd   { fill: #2a6f6f; }
    .na-fill { fill: #8b6f47; } .na-st { fill: none; stroke: #8b6f47; stroke-width: 2; }
    .na-bg   { fill: #8b6f47; opacity: 0.10; }
    .na-hd   { fill: #8b6f47; }
    .acc-fill{ fill: #a83a4a; } .acc-st { fill: none; stroke: #a83a4a; stroke-width: 2.5; }
    .axis-bg { fill: #50643c; opacity: 0.12; }
    .axis-st { fill: none; stroke: #50643c; stroke-width: 2; }
    .white  { fill: #f5f1e8; }
    .reveal { opacity: 1; }
  ]]></style>

  <!-- 제목부 -->
  <text x="600" y="46" text-anchor="middle" class="lbl-head">통념을 경계하라 — 두 갈래가 만나는 자리</text>
  <text x="600" y="76" text-anchor="middle" class="sans lbl-sm">(가) 계녀가 · 규방 가사    │    (나) 상론 · 한문 산문(논변)</text>
  <line x1="60" y1="96" x2="1140" y2="96" class="ink"/>

  <!-- ===================== (가) 좌측 ===================== -->
  <g class="reveal" data-reveal-step="1" id="ga-norm">
    <rect x="60" y="120" width="470" height="48" class="ga-hd"/>
    <text x="80" y="150" class="white lbl-title">(가) 계녀가 — 부녀자의 도리 권계</text>

    <rect x="60" y="186" width="470" height="80" class="paper"/><rect x="60" y="186" width="470" height="80" class="rule"/>
    <rect x="60" y="186" width="6" height="80" class="ga-fill"/>
    <text x="84" y="214" class="lbl-strong">① 며느리의 도리</text>
    <text x="84" y="238" class="sans lbl-sm">문안·봉양과 규방의 부지런한 가사</text>
    <text x="84" y="257" class="sans lbl-xs">'식성을 물어 가며 반찬을 맞게'</text>

    <rect x="60" y="280" width="470" height="80" class="paper"/><rect x="60" y="280" width="470" height="80" class="rule"/>
    <rect x="60" y="280" width="6" height="80" class="ga-fill"/>
    <text x="84" y="308" class="lbl-strong">② 자녀 양육</text>
    <text x="84" y="332" class="sans lbl-sm">감정에 치우치지 않는 절제</text>
    <text x="84" y="351" class="sans lbl-xs">'귀타고…/밉다고…' 하지 말라</text>

    <rect x="60" y="374" width="470" height="80" class="paper"/><rect x="60" y="374" width="470" height="80" class="rule"/>
    <rect x="60" y="374" width="6" height="80" class="ga-fill"/>
    <text x="84" y="402" class="lbl-strong">③ 노비 대우</text>
    <text x="84" y="426" class="sans lbl-sm">'귀천은 다르나마 혈육은 한가지' — 인(仁)</text>
    <text x="84" y="445" class="sans lbl-xs">단, 신분상의 귀천 자체는 전제</text>

    <rect x="60" y="468" width="470" height="80" class="paper"/><rect x="60" y="468" width="470" height="80" class="rule"/>
    <rect x="60" y="468" width="6" height="80" class="ga-fill"/>
    <text x="84" y="496" class="lbl-strong">④ 치산·몸가짐</text>
    <text x="84" y="520" class="sans lbl-sm">검약과 신중 — 남 평론·부귀 흠선 말라</text>
    <text x="84" y="539" class="sans lbl-xs">시집살이 규범을 넘어 '수신(修身)' 전반</text>

    <line x1="44" y1="186" x2="44" y2="548" class="ga-st" marker-end="url(#arInk)"/>
    <text x="295" y="582" text-anchor="middle" class="sans lbl-sm">명령형 '~말아서라'로 도리를 <tspan font-weight="700" fill="#2a6f6f">직접 권계</tspan></text>
  </g>

  <!-- ===================== (나) 우측 ===================== -->
  <g class="reveal" data-reveal-step="2" id="na-thesis">
    <rect x="670" y="120" width="470" height="48" class="na-hd"/>
    <text x="690" y="150" class="white lbl-title">(나) 상론 — 익힘이 상(相)을 만든다</text>

    <!-- 통념(거짓) -->
    <rect x="670" y="186" width="470" height="74" class="paper"/><rect x="670" y="186" width="470" height="74" class="rule"/>
    <text x="690" y="212" class="acc-fill lbl-strong">통념 (글쓴이가 '거짓'이라 함)</text>
    <text x="694" y="244" class="lbl-title">상(相)</text>
    <line x1="760" y1="237" x2="900" y2="237" class="acc-st" marker-end="url(#arAcc)"/>
    <text x="912" y="244" class="lbl-title">익힘 · 운명</text>
    <line x1="744" y1="252" x2="1060" y2="222" class="acc-st"/>
    <text x="1100" y="234" text-anchor="middle" class="acc-fill lbl-head">×</text>

    <!-- 주장 -->
    <rect x="670" y="272" width="470" height="74" class="na-bg"/><rect x="670" y="272" width="470" height="74" class="na-st"/>
    <text x="690" y="298" class="na-fill lbl-strong">글쓴이의 주장</text>
    <text x="694" y="330" class="lbl-title">익힘</text>
    <line x1="772" y1="323" x2="930" y2="323" class="na-st" stroke-width="4" marker-end="url(#arBold)"/>
    <text x="945" y="330" class="lbl-title">상(相)이 변함</text>

    <!-- 무리 대조 -->
    <rect x="670" y="358" width="470" height="74" class="paper"/><rect x="670" y="358" width="470" height="74" class="rule"/>
    <text x="690" y="384" class="lbl-strong">무리에 따라 익힘이 다름 → 상도 달라짐</text>
    <text x="690" y="408" class="sans lbl-sm">서당 · 시장 · 목동 · 강패의 무리를 <tspan font-weight="700">대조</tspan></text>
    <text x="690" y="426" class="sans lbl-xs">사람들은 변한 상을 보고 인과를 거꾸로 읽음(비판 지점)</text>

    <!-- ㉠㉡㉢ -->
    <rect x="670" y="444" width="470" height="104" class="paper2"/><rect x="670" y="444" width="470" height="104" class="rule"/>
    <text x="690" y="470" class="lbl-strong">주위의 평가 → 형세 (보강 사례)</text>
    <text x="690" y="496" class="sans lbl-sm">㉠ '가르칠 만하다' → 지원 ↑ → <tspan font-weight="700">재상</tspan></text>
    <text x="690" y="518" class="sans lbl-sm">㉡ '부자 될 만하다' → 자본 ↑ → <tspan font-weight="700">백만장자</tspan></text>
    <text x="690" y="540" class="sans lbl-sm">㉢ 평가절하 → 협조 ↓ → <tspan font-weight="700" fill="#a83a4a">곤궁</tspan></text>

    <text x="905" y="582" text-anchor="middle" class="sans lbl-sm">사례를 통한 <tspan font-weight="700" fill="#8b6f47">논증</tspan>으로 통념을 비판</text>
  </g>

  <!-- ===================== 공통축 ===================== -->
  <g class="reveal" data-reveal-step="3" id="axis">
    <line x1="535" y1="240" x2="600" y2="240" class="axis-st" stroke-dasharray="4 4"/>
    <line x1="665" y1="240" x2="600" y2="240" class="axis-st" stroke-dasharray="4 4"/>
    <rect x="556" y="120" width="88" height="430" class="axis-bg"/>
    <text x="600" y="345" text-anchor="middle" transform="rotate(-90 600 345)" class="lbl-title" fill="#3c4a2d">통념을 경계하라</text>

    <!-- 하단 통합 띠 -->
    <line x1="60" y1="612" x2="1140" y2="612" class="rule"/>
    <rect x="60" y="632" width="1080" height="250" class="paper2"/><rect x="60" y="632" width="1080" height="250" class="rule"/>
    <text x="600" y="672" text-anchor="middle" class="lbl-title">공통축 · 무엇을 경계하는가</text>

    <rect x="96" y="700" width="440" height="150" class="paper"/><rect x="96" y="700" width="440" height="150" class="rule"/>
    <rect x="96" y="700" width="6" height="150" class="ga-fill"/>
    <text x="120" y="734" class="ga-fill lbl-strong">(가) 계녀가</text>
    <text x="120" y="764" class="sans lbl-sm">관습적 규범 속에서</text>
    <text x="120" y="788" class="sans lbl-sm"><tspan font-weight="700">대조적 상황</tspan>으로 부녀자가 지킬</text>
    <text x="120" y="812" class="sans lbl-sm">도리와 <tspan font-weight="700">수신</tspan>의 태도를 권계</text>
    <text x="120" y="838" class="sans lbl-xs">정서적 당부 · 직접 권계</text>

    <rect x="664" y="700" width="440" height="150" class="paper"/><rect x="664" y="700" width="440" height="150" class="rule"/>
    <rect x="664" y="700" width="6" height="150" class="na-fill"/>
    <text x="688" y="734" class="na-fill lbl-strong">(나) 상론</text>
    <text x="688" y="764" class="sans lbl-sm">관상이라는 <tspan font-weight="700">통념의 인과</tspan>를</text>
    <text x="688" y="788" class="sans lbl-sm">뒤집어(익힘→상) <tspan font-weight="700">사례 논증</tspan>으로</text>
    <text x="688" y="812" class="sans lbl-sm">사람을 겉모습으로 보는 부조리 비판</text>
    <text x="688" y="838" class="sans lbl-xs">이성적 설득 · 논박</text>

    <text x="600" y="780" text-anchor="middle" class="acc-fill lbl-strong">↓</text>
    <text x="600" y="724" text-anchor="middle" class="sans lbl-xs">서로 다른 갈래·방식이지만</text>
  </g>

  <!-- 갈래 복합 태그 -->
  <rect x="980" y="56" width="160" height="26" class="axis-bg"/>
  <text x="1060" y="74" text-anchor="middle" class="sans lbl-xs" fill="#3c4a2d">갈래 복합 · 운문＋산문</text>

  <!-- 워터마크 -->
  <text x="1140" y="936" text-anchor="end" class="sans lbl-xs" fill="#9a9080">EBS 2027 수능특강 · 갈래 복합 · 253쪽</text>
</svg>
